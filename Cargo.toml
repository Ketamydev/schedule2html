[package]
name = "schedule2html"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "schedule2html"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
