<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#999;--line:#d9d9d9;--hl:#edeff5;--hl2:#e3e7f3;--ac:#3b5bdb;
  --sans:"Inter","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  --radius:3px;--row-gap:.4em;--col-gap:.7em}
@property --rows{syntax:"<number>";inherits:false;initial-value:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;padding:2.4vh 3vw;gap:1.8vh;font-size:20px}
header{display:flex;align-items:baseline;justify-content:space-between;flex:none;gap:1em;flex-wrap:wrap}
h1{margin:0;font-weight:600;font-size:1.7em;letter-spacing:-.03em}
h1 span{font-weight:400;color:var(--mute);margin-left:.6em;font-size:.55em;letter-spacing:0}
#clock{font-weight:500;font-size:1.2em;font-variant-numeric:tabular-nums;color:var(--mute)}
#wrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1.6vh}
.sec{flex:var(--rows,1) 1 0;min-height:0;display:grid;column-gap:var(--col-gap);row-gap:var(--row-gap);
  border-top:2px solid var(--ink);padding-top:1em}
.h{padding:var(--gy,.7em) var(--gx,.6em);font-weight:600;font-size:var(--gf,1em);letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--ac);border-radius:var(--radius);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h.blank{background:none}
.n{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:var(--pf,1.05em);
  color:#fff;background:var(--ac);border-radius:var(--radius);line-height:1.1}
.n small{font-size:var(--ptf,.48em);font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.c{padding:var(--ly,.4em) var(--lx,.65em);min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;background:var(--hl);border-radius:var(--radius);border:1px solid var(--line)}
.c.grp1{background:var(--hl2)}
.c.e .s{color:var(--mute);font-weight:400;font-style:italic}
.b{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:.8em;
  padding:var(--by,.12em) .6em;font-size:var(--bf,.68em);color:var(--mute);
  border:1px dashed var(--line);border-radius:var(--radius);white-space:nowrap;overflow:hidden}
.b b{font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.b span{font-variant-numeric:tabular-nums}
.s{font-weight:500;font-size:var(--lf,1em);line-height:1.15;overflow-wrap:anywhere}
.r{color:var(--ac);font-size:var(--rf,.78em);font-weight:600;margin-top:.15em}
.t{color:var(--mute);font-size:var(--tf,.7em)}
.c.now{border-color:var(--ac);background:#edf0fd}
.b.now{color:var(--ac);border-color:var(--ac);border-style:solid;background:#edf0fd}
.past{opacity:var(--dim,.4)}
@media print{html,body{overflow:visible}#wrap{overflow:visible}.past{opacity:1}}
@media (max-width:640px){#clock{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span id="clock"></span>
  </header>
  <div id="wrap"></div>
</div>
<script>
__CONFIG__
</script>
<script>
const DAY = __DATA__;
const DEF = {
  testTime:null, refreshSeconds:20,
  showBreaks:true, showPairTimes:true, showClock:true, showNoLesson:true,
  highlightCurrent:true, dimPast:true, dimOpacity:0.4,
  groupFont:1.0, groupPadY:0.7, groupPadX:0.6,
  pairFont:1.05, pairTimeFont:0.48,
  lessonFont:1.0, roomFont:0.78, teacherFont:0.7, lessonPadY:0.4, lessonPadX:0.65,
  breakFont:0.68, breakPadY:0.12,
  rowGap:0.4, colGap:0.7, radius:3,
  bells:{}, bellDays:{}
};
const num = (v, d) => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : d;
const bool = (v, d) => (typeof v === 'boolean') ? v : d;
const USER = (typeof window.USERCFG !== 'undefined' && window.USERCFG) || {};
const CONFIG = Object.assign({}, DEF, USER);
CONFIG.testTime = (typeof CONFIG.testTime === 'string' && /^\d{1,2}:\d{2}$/.test(CONFIG.testTime)) ? CONFIG.testTime : null;
CONFIG.refreshSeconds = num(CONFIG.refreshSeconds, 20) || 20;
['showBreaks','showPairTimes','showClock','showNoLesson','highlightCurrent','dimPast'].forEach(k => CONFIG[k] = bool(CONFIG[k], true));
CONFIG.dimOpacity = (typeof CONFIG.dimOpacity === 'number' && CONFIG.dimOpacity >= 0 && CONFIG.dimOpacity <= 1) ? CONFIG.dimOpacity : 0.4;
['groupFont','groupPadY','groupPadX','pairFont','pairTimeFont','lessonFont','roomFont','teacherFont',
 'lessonPadY','lessonPadX','breakFont','breakPadY','rowGap','colGap','radius'].forEach(k => CONFIG[k] = num(CONFIG[k], DEF[k]));
if (!CONFIG.bells || typeof CONFIG.bells !== 'object') CONFIG.bells = {};
if (!CONFIG.bellDays || typeof CONFIG.bellDays !== 'object') CONFIG.bellDays = {};
const wrap = document.getElementById('wrap');
const app = document.querySelector('#app');
const root = document.documentElement.style;
root.setProperty('--dim', CONFIG.dimOpacity);
root.setProperty('--radius', CONFIG.radius + 'px');
root.setProperty('--row-gap', CONFIG.rowGap + 'em');
root.setProperty('--col-gap', CONFIG.colGap + 'em');
root.setProperty('--gf', CONFIG.groupFont + 'em');
root.setProperty('--gy', CONFIG.groupPadY + 'em');
root.setProperty('--gx', CONFIG.groupPadX + 'em');
root.setProperty('--pf', CONFIG.pairFont + 'em');
root.setProperty('--ptf', CONFIG.pairTimeFont + 'em');
root.setProperty('--lf', CONFIG.lessonFont + 'em');
root.setProperty('--rf', CONFIG.roomFont + 'em');
root.setProperty('--tf', CONFIG.teacherFont + 'em');
root.setProperty('--ly', CONFIG.lessonPadY + 'em');
root.setProperty('--lx', CONFIG.lessonPadX + 'em');
root.setProperty('--bf', CONFIG.breakFont + 'em');
root.setProperty('--by', CONFIG.breakPadY + 'em');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d = new Date(DAY.date + 'T00:00:00');
const wd = d.toLocaleDateString('ru-RU', {weekday:'long'});
document.getElementById('title').innerHTML =
  'Расписание<span>' + wd + ', ' + d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) + '</span>';
document.title = 'Расписание на ' + d.toLocaleDateString('ru-RU');

const dayKey = CONFIG.bellDays[d.getDay()];
const bells = dayKey ? CONFIG.bells[dayKey] : null;
const lessonBell = n => (CONFIG.showPairTimes && bells) ? bells.find(x => x.k === 'l' && x.n === n) : null;
if (!CONFIG.showClock) document.getElementById('clock').style.display = 'none';

for (const s of DAY.sections){
  const rows = [...s.rows].sort((a, b) => a.n - b.n);
  const slots = [];
  rows.forEach((r, i) => {
    slots.push({t:'l', r});
    const nx = rows[i + 1];
    if (CONFIG.showBreaks && bells && nx && nx.n === r.n + 1){
      const li = bells.findIndex(x => x.k === 'l' && x.n === r.n);
      if (li >= 0 && bells[li + 1] && bells[li + 1].k === 'b' &&
          bells[li + 2] && bells[li + 2].k === 'l' && bells[li + 2].n === nx.n){
        slots.push({t:'b', b:bells[li + 1]});
      }
    }
  });
  const el = document.createElement('section');
  el.className = 'sec';
  el.style.setProperty('--rows', rows.length + 1);
  el.style.gridTemplateColumns = '3.4em repeat(' + s.groups.length + ', minmax(0,1fr))';
  el.style.gridTemplateRows = 'auto ' + slots.map(x => x.t === 'l' ? 'minmax(0,1fr)' : 'auto').join(' ');
  let h = '<div class="h blank"></div>' + s.groups.map(g => '<div class="h">' + esc(g) + '</div>').join('');
  const last = s.groups.map((_, ci) => rows.reduce((a, r, ri) => r.cells[ci] ? ri : a, -1));
  for (const x of slots){
    if (x.t === 'b'){
      h += '<div class="b" data-s="' + x.b.s + '" data-e="' + x.b.e + '"><b>' + esc(x.b.t) +
           '</b><span>' + x.b.s + '–' + x.b.e + '</span></div>';
      continue;
    }
    const r = x.r, ri = rows.indexOf(r), lb = lessonBell(r.n);
    h += '<div class="n" data-n="' + r.n + '">' + r.n +
         (lb ? '<small>' + lb.s + '–' + lb.e + '</small>' : '') + '</div>';
    for (const [i, l] of r.cells.entries()){
      if (l){
        h += '<div class="c grp' + (i % 2) + '" data-n="' + r.n + '">' +
             '<div class="s">' + esc(l.subject) + '</div>' +
             (l.room ? '<div class="r">' + esc(l.room) + '</div>' : '') +
             (l.teacher ? '<div class="t">' + esc(l.teacher) + '</div>' : '') + '</div>';
      } else {
        h += '<div class="c grp' + (i % 2) + ' e" data-n="' + r.n + '"><div class="s">' +
             (CONFIG.showNoLesson && ri < last[i] ? 'Нет пары' : '') + '</div></div>';
      }
    }
  }
  el.innerHTML = h;
  wrap.appendChild(el);
}

function overflows(){
  if (wrap.scrollHeight > wrap.clientHeight + 1) return true;
  return [...document.querySelectorAll('.c,.b')].some(c => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1);
}
function fit(){
  let lo = 8, hi = 56;
  while (hi - lo > 0.5){
    const mid = (lo + hi) / 2;
    app.style.fontSize = mid + 'px';
    overflows() ? hi = mid : lo = mid;
  }
  app.style.fontSize = lo + 'px';
}

const toMin = t => { const p = t.split(':'); return (+p[0]) * 60 + (+p[1]); };
function nowMin(){
  if (CONFIG.testTime){
    const p = CONFIG.testTime.split(':');
    if (p.length === 2 && !isNaN(+p[0]) && !isNaN(+p[1])) return (+p[0]) * 60 + (+p[1]);
  }
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}
function highlight(){
  document.querySelectorAll('.now,.past').forEach(e => e.classList.remove('now', 'past'));
  if (!bells || !CONFIG.highlightCurrent && !CONFIG.dimPast) return;
  const cur = nowMin();
  for (const l of bells.filter(x => x.k === 'l')){
    const s = toMin(l.s), e = toMin(l.e);
    document.querySelectorAll('[data-n="' + l.n + '"]').forEach(c => {
      if (CONFIG.dimPast && e <= cur) c.classList.add('past');
      else if (CONFIG.highlightCurrent && s <= cur && !c.classList.contains('e')) c.classList.add('now');
    });
  }
  if (!CONFIG.showBreaks) return;
  document.querySelectorAll('.b').forEach(b => {
    const s = toMin(b.dataset.s), e = toMin(b.dataset.e);
    if (CONFIG.dimPast && e <= cur) b.classList.add('past');
    else if (CONFIG.highlightCurrent && s <= cur) b.classList.add('now');
  });
}

function tick(){
  const clock = document.getElementById('clock');
  if (CONFIG.testTime){
    clock.textContent = CONFIG.testTime;
  } else {
    clock.textContent = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  }
  highlight();
}
tick(); setInterval(tick, (CONFIG.refreshSeconds || 20) * 1000);
addEventListener('resize', fit);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fit);
</script>
</body>
</html>
